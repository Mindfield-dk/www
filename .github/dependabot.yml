version: 2
updates:
# Fetch and update latest `npm` packages
- package-ecosystem: npm
  directory: '/'
  schedule:
    interval: daily
    time: '00:00'
  open-pull-requests-limit: 10
  reviewers:
    - localgod
  assignees:
    - localgod
  commit-message:
    prefix: fix
    prefix-development: chore
    include: scope
  ignore:
    # TypeScript 7 breaks vue-tsc and typescript-eslint; stay on 6.x until they support it
    - dependency-name: typescript
      update-types: ['version-update:semver-major']
# Fetch and update latest `github-actions` pkgs
- package-ecosystem: github-actions
  directory: '/'
  schedule:
    interval: daily
    time: '00:00'
  open-pull-requests-limit: 10
  reviewers:
    - localgod
  assignees:
    - localgod
  commit-message:
    prefix: fix
    prefix-development: chore
    include: scope